  <style>
    /* Quiz-scoped styles — namespaced .qz-* to avoid collisions with styles.css */
    .qz-wrap {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .qz-top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 16px;
      min-height: 44px;
    }
    .qz-back {
      background: none; border: none; padding: 6px 10px 6px 0;
      font-size: 22px; color: var(--ink); cursor: pointer;
      visibility: hidden;
    }
    .qz-back.is-visible { visibility: visible; }
    .qz-progress {
      flex: 1; height: 4px; border-radius: 999px;
      background: var(--line-soft); overflow: hidden;
      opacity: 0; transition: opacity .3s;
    }
    .qz-progress.is-visible { opacity: 1; }
    .qz-progress > i {
      display: block; height: 100%; width: 0;
      background: var(--ink); border-radius: 999px;
      transition: width .35s ease;
    }
    .qz-logo { font-weight: 900; letter-spacing: .02em; font-size: 15px; color: var(--ink); text-decoration: none; }

    .qz-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .qz-step { animation: qzIn .35s ease both; }
    @keyframes qzIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

    .qz-kicker { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
    .qz-h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; font-weight: 900; color: var(--ink); margin: 0 0 10px; }
    .qz-sub { font-size: 16px; line-height: 1.5; color: var(--ink-muted); margin: 0 0 26px; }

    .qz-options { display: flex; flex-direction: column; gap: 10px; }
    .qz-opt {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; text-align: left; cursor: pointer;
      background: var(--bg-card); border: 1.5px solid var(--line);
      border-radius: 16px; padding: 15px 18px;
      font: inherit; color: var(--ink);
      transition: transform .12s ease, border-color .15s, background .15s;
    }
    .qz-opt:active { transform: scale(.985); }
    .qz-opt.is-selected { border-color: var(--ink); background: #fff; }
    .qz-opt b { font-size: 16.5px; font-weight: 700; }
    .qz-opt span { font-size: 13.5px; color: var(--ink-muted); }
    .qz-opt .qz-check { margin-left: auto; }

    .qz-opt.qz-multi { flex-direction: row; align-items: center; }
    .qz-opt.qz-multi::after {
      content: ""; margin-left: auto; width: 22px; height: 22px; flex: 0 0 22px;
      border: 2px solid var(--line); border-radius: 7px;
      transition: background .15s, border-color .15s;
    }
    .qz-opt.qz-multi.is-selected::after {
      background: var(--ink) center/13px no-repeat
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23FAF7F0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
      border-color: var(--ink);
    }

    .qz-textarea {
      width: 100%; box-sizing: border-box; min-height: 110px; resize: none;
      background: var(--bg-card); border: 1.5px solid var(--line); border-radius: 16px;
      padding: 15px 18px; font: inherit; font-size: 16px; color: var(--ink);
    }
    .qz-textarea:focus { outline: none; border-color: var(--ink); }
    .qz-hint { font-size: 13px; color: var(--ink-faint); margin-top: 8px; }

    .qz-cta {
      display: block; width: 100%; box-sizing: border-box; text-align: center;
      background: var(--ink); color: var(--light); border: none; cursor: pointer;
      border-radius: 999px; padding: 17px 24px; margin-top: 26px;
      font: inherit; font-size: 17px; font-weight: 800; letter-spacing: .01em;
      transition: transform .12s ease, opacity .15s; text-decoration: none;
    }
    .qz-cta:active { transform: scale(.985); }
    .qz-cta[disabled] { opacity: .45; cursor: default; }
    .qz-cta--gold { background: var(--gold); color: var(--bg-dark); }

    /* Building */
    .qz-build { text-align: center; }
    .qz-build-row {
      display: flex; align-items: center; gap: 12px; text-align: left;
      background: var(--bg-card); border: 1.5px solid var(--line); border-radius: 14px;
      padding: 14px 16px; margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--ink-muted);
      opacity: .35; transition: opacity .4s;
    }
    .qz-build-row.is-active { opacity: 1; }
    .qz-build-row .qz-dot {
      width: 22px; height: 22px; flex: 0 0 22px; border-radius: 999px;
      border: 2.5px solid var(--line); box-sizing: border-box;
    }
    .qz-build-row.is-done .qz-dot {
      border-color: var(--gold);
      background: var(--gold) center/12px no-repeat
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%230D0C0B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
    }

    /* Reveal */
    .qz-plan-card {
      background: var(--bg-card); border: 1.5px solid var(--line); border-radius: 20px;
      padding: 20px; margin-top: 18px;
    }
    .qz-week { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .qz-week:last-child { border-bottom: none; }
    .qz-week-num {
      width: 34px; height: 34px; flex: 0 0 34px; border-radius: 999px;
      background: var(--bg-soft); border: 1.5px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: var(--ink);
    }
    .qz-week b { display: block; font-size: 15.5px; color: var(--ink); }
    .qz-week span { font-size: 13.5px; line-height: 1.45; color: var(--ink-muted); }
    .qz-insight {
      background: var(--bg-dark); color: var(--light); border-radius: 16px;
      padding: 16px 18px; font-size: 15px; line-height: 1.55; margin-top: 18px;
    }
    .qz-insight b { color: var(--gold); }
    .qz-smallprint { text-align: center; font-size: 12.5px; color: var(--ink-faint); margin-top: 12px; }
    .qz-trust { display: flex; justify-content: center; gap: 18px; margin-top: 16px; font-size: 12.5px; color: var(--ink-faint); }
  </style>
</head>
<body>
  <div class="qz-wrap">
    <div class="qz-top">
      <button class="qz-back" id="qzBack" aria-label="Zurück">‹</button>
      <div class="qz-progress" id="qzProgress"><i id="qzProgressBar"></i></div>
      <a class="qz-logo" href="/">FACE IT.</a>
    </div>
    <div class="qz-stage" id="qzStage" aria-live="polite"></div>
  </div>

  <script>
  (() => {
    'use strict';

    // ——— Quiz data (identisch zum App-Onboarding) ———
    const FOCUS_AREAS = [
      { id: 'Social confidence',  name: 'Soziales Selbstvertrauen', sub: 'Zeig dich und sprich aus',            fear: 'Angst vor Ablehnung' },
      { id: 'Procrastination',    name: 'Prokrastination',          sub: 'Starte ohne perfekte Bedingungen',    fear: 'Angst zu versagen' },
      { id: 'Self-doubt',         name: 'Selbstzweifel',            sub: 'Vertraue dir selbst unter Druck',     fear: 'Angst, nicht gut genug zu sein' },
      { id: 'Relationships',      name: 'Beziehungen',              sub: 'Führe die schwierigen Gespräche',     fear: 'Angst vor Konflikt oder Verlassenwerden' },
      { id: 'Health and body',    name: 'Gesundheit & Körper',      sub: 'Wähle Handlung statt Komfort',        fear: 'Angst vor Unbehagen' },
      { id: 'Career and purpose', name: 'Karriere & Berufung',      sub: 'Wage größere Schritte',               fear: 'Angst vor Bewertung im Job' },
    ];
    const FREQUENCY = [
      { id: 'daily',          label: 'Jeden Tag',                 note: 'jeden Tag' },
      { id: 'fewTimesAWeek',  label: 'Ein paar Mal pro Woche',    note: 'mehrmals pro Woche' },
      { id: 'weekly',         label: 'Etwa einmal pro Woche',     note: 'etwa einmal pro Woche' },
      { id: 'rarely',         label: 'Selten — aber dann zählt es', note: 'selten — aber in den Momenten, die zählen' },
    ];
    const INTENSITY = [
      { id: 'mild',         label: 'Leicht — Hintergrundrauschen' },
      { id: 'noticeable',   label: 'Spürbar — ich zögere' },
      { id: 'strong',       label: 'Stark — meistens ziehe ich zurück' },
      { id: 'overwhelming', label: 'Überwältigend — ich mache dicht' },
    ];
    const COSTS = [
      { id: 'opportunities', label: 'Chancen' },
      { id: 'relationships', label: 'Beziehungen' },
      { id: 'health',        label: 'Gesundheit & Energie' },
      { id: 'selfRespect',   label: 'Selbstachtung' },
      { id: 'moneyCareer',   label: 'Geld & Karriere' },
    ];
    const DURATION = [
      { id: 'months',        label: 'Ein paar Monate' },
      { id: 'oneToTwoYears', label: '1–2 Jahre' },
      { id: 'severalYears',  label: 'Mehrere Jahre' },
      { id: 'always',        label: 'Solange ich denken kann' },
    ];
    const WEEKS = [
      { t: 'Das Muster sehen',        d: 'Tägliche Check-ins und dein erstes Coaching machen das Vermeiden sichtbar.' },
      { t: 'Erste kleine Siege',      d: 'Ein kleiner Konfrontations-Schritt — wenig Risiko, echte Bewegung.' },
      { t: 'Den Einsatz erhöhen',     d: 'Stell dich einer Sache, die du aufgeschoben hast. Mit Rückendeckung.' },
      { t: 'Beweise es dir selbst',   d: 'Tu das, wofür du hergekommen bist.' },
    ];
    const STORE_URL = 'https://apps.apple.com/de/app/face-it-dein-ki-coach/id6748347064';

    // ——— State ———
    const answers = { focus: null, frequency: null, intensity: null, costs: [], duration: null, goal: '' };
    // steps: 0 intro · 1–5 fragen · 6 ziel · 7 building · 8 reveal
    let step = 0;
    let quizStartedFired = false;

    const stage = document.getElementById('qzStage');
    const back = document.getElementById('qzBack');
    const progress = document.getElementById('qzProgress');
    const progressBar = document.getElementById('qzProgressBar');

    function track(name, params) {
      try { if (window.fbq) fbq('trackCustom', name, params || {}); } catch (_e) {}
      try { if (window.gtag) gtag('event', name, params || {}); } catch (_e) {}
    }
    function saveQuiz() {
      try { localStorage.setItem('fi_quiz', JSON.stringify({ ...answers, ts: Date.now() })); } catch (_e) {}
    }

    // ——— Rendering ———
    function render() {
      back.classList.toggle('is-visible', step > 0 && step < 7);
      progress.classList.toggle('is-visible', step >= 1 && step <= 6);
      progressBar.style.width = Math.min((step / 6) * 100, 100) + '%';
      stage.innerHTML = '';
      const el = document.createElement('div');
      el.className = 'qz-step';
      stage.appendChild(el);
      [intro, q1, q2, q3, q4, q5, q6, building, reveal][step](el);
      window.scrollTo(0, 0);
    }

    function heading(el, kicker, title, sub) {
      el.innerHTML += (kicker ? `<p class="qz-kicker">${kicker}</p>` : '') +
        `<h1 class="qz-h1">${title}</h1>` + (sub ? `<p class="qz-sub">${sub}</p>` : '');
    }

    function singleChoice(el, items, withSub, onPick) {
      const box = document.createElement('div');
      box.className = 'qz-options';
      items.forEach((item) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'qz-opt';
        b.innerHTML = `<b>${withSub ? item.name : item.label}</b>` + (withSub ? `<span>${item.sub}</span>` : '');
        b.addEventListener('click', () => {
          b.classList.add('is-selected');
          if (!quizStartedFired) { quizStartedFired = true; track('QuizStarted'); }
          setTimeout(() => onPick(item), 220);
        });
        box.appendChild(b);
      });
      el.appendChild(box);
    }

    function intro(el) {
      heading(el, 'Der 60-Sekunden-Check',
        'Was wäre, wenn du aufhörst auszuweichen?',
        'Beantworte 6 kurze Fragen und erhalte einen persönlichen 4-Wochen-Plan gegen die Angst, die dich zurückhält.');
      const cta = document.createElement('button');
      cta.className = 'qz-cta';
      cta.textContent = 'Los geht’s';
      cta.addEventListener('click', () => { step = 1; render(); });
      el.appendChild(cta);
      const trust = document.createElement('div');
      trust.className = 'qz-trust';
      trust.innerHTML = '<span>✓ Kostenlos</span><span>✓ Anonym</span><span>✓ 60 Sekunden</span>';
      el.appendChild(trust);
    }

    function q1(el) {
      heading(el, 'Frage 1 von 6', 'Was hält dich am meisten zurück?', 'Wähle den Bereich, der gerade am meisten wehtut.');
      singleChoice(el, FOCUS_AREAS, true, (item) => { answers.focus = item; step = 2; render(); });
    }
    function q2(el) {
      heading(el, 'Frage 2 von 6', 'Wie oft redest du dir etwas aus?', 'Sei ehrlich — das bleibt unter uns.');
      singleChoice(el, FREQUENCY, false, (item) => { answers.frequency = item; step = 3; render(); });
    }
    function q3(el) {
      heading(el, 'Frage 3 von 6', 'Wie stark ist die Angst in diesen Momenten?', 'Es gibt keine falsche Antwort.');
      singleChoice(el, INTENSITY, false, (item) => { answers.intensity = item; step = 4; render(); });
    }
    function q4(el) {
      heading(el, 'Frage 4 von 6', 'Was hat dich das Vermeiden schon gekostet?', 'Wähle alles aus, was zutrifft.');
      const box = document.createElement('div');
      box.className = 'qz-options';
      COSTS.forEach((item) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'qz-opt qz-multi';
        b.innerHTML = `<b>${item.label}</b>`;
        b.addEventListener('click', () => {
          const i = answers.costs.findIndex((c) => c.id === item.id);
          if (i >= 0) answers.costs.splice(i, 1); else answers.costs.push(item);
          b.classList.toggle('is-selected');
          cta.disabled = answers.costs.length === 0;
        });
        box.appendChild(b);
      });
      el.appendChild(box);
      const cta = document.createElement('button');
      cta.className = 'qz-cta';
      cta.textContent = 'Weiter';
      cta.disabled = true;
      cta.addEventListener('click', () => { step = 5; render(); });
      el.appendChild(cta);
    }
    function q5(el) {
      heading(el, 'Frage 5 von 6', 'Wie lange läuft dieses Muster schon?', 'Die Laufzeit hilft uns, deinen Plan richtig zu takten.');
      singleChoice(el, DURATION, false, (item) => { answers.duration = item; step = 6; render(); });
    }
    function q6(el) {
      heading(el, 'Frage 6 von 6', 'Was würdest du tun, wenn die Angst dich nicht stoppen könnte?',
        'Ein Satz reicht. Dein Plan arbeitet auf genau dieses Ziel hin.');
      const ta = document.createElement('textarea');
      ta.className = 'qz-textarea';
      ta.maxLength = 200;
      ta.placeholder = 'z. B. „Endlich im Meeting meine Meinung sagen“';
      ta.addEventListener('input', () => { answers.goal = ta.value.trim(); });
      el.appendChild(ta);
      el.insertAdjacentHTML('beforeend', '<p class="qz-hint">Optional — du kannst es auch später mit deinem Coach herausarbeiten.</p>');
      const cta = document.createElement('button');
      cta.className = 'qz-cta';
      cta.textContent = 'Meinen Plan erstellen';
      cta.addEventListener('click', () => { step = 7; render(); });
      el.appendChild(cta);
    }

    function building(el) {
      el.className += ' qz-build';
      heading(el, null, 'Dein Plan wird erstellt…', null);
      const steps = ['Antworten analysieren', 'Wochenschritte zusammenstellen', 'Deinen Coach kalibrieren'];
      const rows = steps.map((s) => {
        const r = document.createElement('div');
        r.className = 'qz-build-row';
        r.innerHTML = `<span class="qz-dot"></span>${s}`;
        el.appendChild(r);
        return r;
      });
      rows.forEach((r, i) => {
        setTimeout(() => r.classList.add('is-active'), 300 + i * 800);
        setTimeout(() => r.classList.add('is-done'), 900 + i * 800);
      });
      setTimeout(() => {
        saveQuiz();
        track('QuizCompleted', { focus_area: answers.focus ? answers.focus.id : 'unknown' });
        step = 8; render();
      }, 900 + steps.length * 800 + 400);
    }

    function reveal(el) {
      const f = answers.focus || FOCUS_AREAS[0];
      heading(el, 'Dein Plan ist bereit',
        `Dein 4-Wochen-Plan: ${f.name}`,
        `Kernangst: ${f.fear}`);

      const card = document.createElement('div');
      card.className = 'qz-plan-card';
      card.innerHTML = WEEKS.map((w, i) => {
        const detail = (i === 3 && answers.goal)
          ? `Dein Ziel: „${answers.goal.replace(/</g, '&lt;')}“`
          : w.d;
        return `<div class="qz-week"><div class="qz-week-num">${i + 1}</div><div><b>${w.t}</b><span>${detail}</span></div></div>`;
      }).join('');
      el.appendChild(card);

      const freqNote = answers.frequency ? answers.frequency.note : 'immer wieder';
      const costList = answers.costs.length
        ? answers.costs.map((c) => c.label).join(', ')
        : 'mehr, als dir lieb ist';
      el.insertAdjacentHTML('beforeend',
        `<div class="qz-insight">Du redest es dir <b>${freqNote}</b> aus — und es kostet dich bereits: <b>${costList}</b>. Beruhigung hat das nicht geändert. Konfrontation in kleinen Schritten schon.</div>`);

      const cta = document.createElement('a');
      cta.className = 'qz-cta qz-cta--gold';
      cta.textContent = 'Plan in der App starten — 3 Tage kostenlos';
      cta.href = decoratedStoreURL();
      cta.target = '_blank';
      cta.rel = 'noopener';
      cta.addEventListener('click', () => {
        try { if (window.fbq) fbq('trackCustom', 'ClickedAppStoreButton', { source: 'quiz' }); } catch (_e) {}
        try { if (window.gtag) gtag('event', 'quiz_store_click'); } catch (_e) {}
      });
      el.appendChild(cta);
      el.insertAdjacentHTML('beforeend',
        '<p class="qz-smallprint">Dein Coach kennt deinen Plan, sobald du die App öffnest.<br/>Nach dem Test 59,99 €/Jahr — jederzeit kündbar.</p>');
    }

    // Session-/Meta-IDs an den Store-Link hängen (Universal-Link-Pfad) — die
    // globale attribution.js dekoriert nur Links, die beim Laden existieren;
    // dieser CTA entsteht erst nach dem Quiz.
    function decoratedStoreURL() {
      try {
        const url = new URL(STORE_URL);
        const s = window.__faceItSession || {};
        if (s.sessionId) url.searchParams.set('fi_session', s.sessionId);
        if (s.fbc) url.searchParams.set('fbc', s.fbc);
        if (s.fbp) url.searchParams.set('fbp', s.fbp);
        return url.toString();
      } catch (_e) { return STORE_URL; }
    }

    back.addEventListener('click', () => { if (step > 0 && step < 7) { step -= 1; render(); } });
    render();
  })();
  </script>

  <!-- Session + Meta-ID-Erfassung (recordLandingVisit, fbc/fbp) -->
  <script src="/attribution.js" defer></script>
</body>
</html>
